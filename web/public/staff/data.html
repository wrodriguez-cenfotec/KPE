<!doctype html>
<html lang="es" data-theme="corporate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pregúntele a sus datos | Gestión KPE</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-base-200">
  <header id="navbar"></header>
  <main id="main" class="max-w-7xl mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Pregúntele a sus datos</h1>
    <form id="ask" class="card bg-base-100 p-4 grid gap-2 mb-4">
      <textarea name="question" class="textarea textarea-bordered" rows="2" placeholder="Por ejemplo, ¿cuántas reservas confirmadas hubo en octubre?"></textarea>
      <button class="btn btn-primary justify-self-end">Consultar</button>
    </form>
    <div id="content"></div>
  </main>
  <script type="module" src="/js/staff/data.js"></script>
</body>
</html>
