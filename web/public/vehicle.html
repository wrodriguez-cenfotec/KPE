<!doctype html>
<html lang="es" data-theme="corporate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehículo | Kilometreados Pero Enteritos</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-base-200">
  <header id="navbar"></header>
  <main class="max-w-6xl mx-auto p-4">
    <a href="/" class="btn btn-ghost btn-sm mb-2">← Volver al catálogo</a>
    <div id="detail"></div>
    <h2 class="text-xl font-bold mt-8 mb-2">Vehículos similares</h2>
    <div id="similar" class="grid gap-4 sm:grid-cols-3"></div>
    <dialog id="finance" class="modal"><div class="modal-box">
      <h3 class="font-bold text-lg">Simular financiamiento</h3>
      <form id="finance-form" class="grid gap-2 mt-2">
        <label class="form-control"><span class="label-text">Precio</span><input name="price" type="number" class="input input-bordered" readonly></label>
        <label class="form-control"><span class="label-text">Prima (%)</span><input name="down_payment" type="number" value="20" min="20" max="90" class="input input-bordered"></label>
        <label class="form-control"><span class="label-text">Plazo en meses</span><input name="term" type="number" value="72" min="12" max="84" class="input input-bordered"></label>
        <label class="form-control"><span class="label-text">Tasa anual (%)</span><input name="rate" type="number" value="11.5" step="0.1" class="input input-bordered"></label>
      </form>
      <p class="mt-3 text-lg">Cuota mensual aproximada <span id="payment" class="font-bold"></span></p>
      <div class="modal-action"><form method="dialog"><button class="btn">Cerrar</button></form></div>
    </div></dialog>
    <dialog id="reserve" class="modal"><div class="modal-box" id="reserve-body"></div></dialog>
  </main>
  <script type="module" src="/js/vehicle.js"></script>
</body>
</html>
