<!doctype html>
<html lang="es" data-theme="corporate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | Kilometreados Pero Enteritos</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-base-200">
  <header id="navbar"></header>
  <main class="max-w-6xl mx-auto p-4">
    <div class="card bg-base-100 max-w-md mx-auto mt-8"><div class="card-body">
      <h1 class="card-title">Ingresar</h1>
      <p class="text-sm opacity-70">Use el correo y la contraseña que le dio su asesor de ventas.</p>
      <form id="login" class="grid gap-3 mt-2">
        <input name="email" type="email" class="input input-bordered" placeholder="Correo" required>
        <input name="password" type="password" class="input input-bordered" placeholder="Contraseña" required>
        <button class="btn btn-primary">Ingresar</button>
        <p id="error" class="text-error text-sm"></p>
      </form>
    </div></div>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
