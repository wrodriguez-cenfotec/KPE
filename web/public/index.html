<!doctype html>
<html lang="es" data-theme="corporate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kilometreados Pero Enteritos</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-base-200">
  <header id="navbar"></header>
  <main class="max-w-6xl mx-auto p-4">
    <section class="mb-4">
      <h1 class="text-3xl font-bold">Encuentre su próximo carro</h1>
      <p class="opacity-80">Compra 100% en línea desde Heredia. Cada carro pasa por una inspección de 120 puntos en nuestro taller antes de publicarse.</p>
    </section>
    <form id="filters" class="card bg-base-100 p-4 mb-4 grid gap-2 md:grid-cols-6">
      <input name="q" class="input input-bordered md:col-span-2" placeholder="Buscar, por ejemplo SUV familiar económica">
      <select name="brand" class="select select-bordered"><option value="">Marca</option></select>
      <select name="fuel" class="select select-bordered"><option value="">Combustible</option></select>
      <select name="transmission" class="select select-bordered"><option value="">Transmisión</option></select>
      <input name="price_max" type="number" step="100000" class="input input-bordered" placeholder="Precio máximo">
      <input name="year_min" type="number" class="input input-bordered" placeholder="Año desde">
      <label class="label cursor-pointer justify-start gap-2 md:col-span-2"><input type="checkbox" name="semantic" class="checkbox checkbox-sm"><span class="label-text">Búsqueda inteligente</span></label>
      <button class="btn btn-primary md:col-start-6">Buscar</button>
    </form>
    <p id="total" class="text-sm opacity-70 mb-2"></p>
    <div id="grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    <div id="pager" class="join mt-6 flex justify-center"></div>
  </main>
  <script type="module" src="/js/catalog.js"></script>
</body>
</html>
